{% extends 'base.html' %}
{% block content %}
<div class="card auth-card">
    <div class="auth-head">
        <h2>Đăng ký</h2>
        <div class="small">Tạo tài khoản để lưu xe, theo dõi lịch sử tư vấn và sử dụng đầy đủ chức năng hệ thống.</div>
    </div>

    <form method="post" class="auth-form">
        <div class="grid">
            <div class="col-12"><label>Email</label><input name="email" type="email" required
                    placeholder="ban@email.com" /></div>
            <div class="col-12"><label>Mật khẩu</label><input name="password" type="password" required
                    placeholder="Tối thiểu 6 ký tự" /></div>
            <div class="col-12"><button class="btn" type="submit">Tạo tài khoản</button></div>
        </div>
    </form>

    <div class="small" style="margin-top:10px;">Đã có tài khoản? <a href="{{ url_for('login') }}">Đăng nhập</a></div>
</div>
{% endblock %}
