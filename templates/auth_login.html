{% extends 'base.html' %}
{% block content %}
<div class="card auth-card">
    <div class="auth-head">
        <h2>Đăng nhập</h2>
        <div class="small">Quản lý danh sách xe, lịch sử và tính năng đánh giá theo tài khoản.</div>
    </div>

    <form method="post" class="auth-form">
        <div class="grid">
            <div class="col-12"><label>Email</label><input name="email" type="email" required
                    placeholder="ban@email.com" /></div>
            <div class="col-12"><label>Mật khẩu</label><input name="password" type="password" required
                    placeholder="Nhập mật khẩu" /></div>
            <div class="col-12"><button class="btn" type="submit">Đăng nhập</button></div>
        </div>
    </form>

    <div class="small" style="margin-top:10px;">Chưa có tài khoản? <a href="{{ url_for('register') }}">Đăng ký</a></div>
</div>
{% endblock %}
